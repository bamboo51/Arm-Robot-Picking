# Single source of scene constants.
# Gazebo world frame: origin on the floor.
# MoveIt "world" frame: origin at the robot base (z_moveit = z_gazebo - table.top_z).
# Keep in sync with camera/worlds/table_camera.sdf.

table:
  top_z: 1.015            # Gazebo z of the table surface (robot spawned here)

box:
  name: pick_box
  size: 0.05              # cube edge length
  origin: bottom          # model origin is the bottom face (measured resting z = 1.015)
  spawn_z: 1.015          # Gazebo z
  sampling_bounds:        # x/y in both frames
    xmin: -0.02
    xmax: 0.02
    ymin: -0.12
    ymax: -0.08

car:
  name: placement_car
  pose: [0.05, 0.00, 1.015]   # Gazebo model origin (wheel bottoms)
  roof_center: [0.10, 0.00]   # chassis is offset +0.05 in x from the origin
  roof_z: 0.025               # MoveIt z of the chassis top (small car)

grasp:
  approach_z: 0.17        # MoveIt z of the hand above the box
  grasp_z: 0.14           # MoveIt z of the hand when closing
  hand_offset_y: 0.01     # hand y minus box y at grasp
  release_clearance: 0.003
  transfer_clearance: 0.005   # keep transfer height <= ~0.175 (arm reach limit)

success:
  xy_tolerance: 0.03      # box must end within this distance of car.roof_center
  z_tolerance: 0.01       # box bottom must be within this of car.roof_z
